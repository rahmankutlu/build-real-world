name: Deploy GitHub Pages
# Publishes the static export that CI built and tested. Runs only after CI
# succeeds for a push (or manual run) on main, so broken content never deploys.
# To redeploy manually, run the CI workflow on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  package:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v8
        with:
          name: site-pages
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify artifact targets the repository base path
        run: |
          test -f out/index.html
          test -f out/404.html
          grep -q '/${{ github.event.repository.name }}/_next/' out/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
